<style>
  /* Layout: one centered column; the three strips are the page. Chrome stays a true neutral gray, as in a color-grading

  :root {

    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1a1a; --panel: #262626; --ink: #f1f1f1; --muted: #a6a6a6; --line: #454545; --good: #74d394; --bad: #f29188; --good-bg: #1c8a49; --bad-bg: #c5382d; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #1a1a1a; --panel: #262626; --ink: #f1f1f1; --muted: #a6a6a6; --line: #454545; --good: #74d394; --bad: #f29188; --good-bg: #1c8a49; --bad-bg: #c5382d; color-scheme: dark }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--body); }
  .wrap { max-width: 880px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  h1 { margin: 0; font: 400 1.5rem/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
  .meter { display: flex; gap: 18px; font: 500 0.82rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter b { color: var(--ink); font-weight: 500; }
  .how { margin: 0; max-width: 62ch; color: var(--muted); font-size: 0.95rem; }

  .ask { margin: 0; font: 500 0.82rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .who { margin: 6px 0 0; font: 400 clamp(2.5rem, 9.5vw, 5.25rem)/0.98 var(--display); letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 0.95rem; }
  .game { display: grid; gap: 20px; }

  .strips { display: grid; gap: 16px; }
  .strip { display: grid; grid-template-columns: 2rem minmax(0, 1fr); column-gap: 8px; align-items: start; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .strip .key { grid-row: 1; align-self: center; font: 500 0.95rem/1 var(--mono); color: var(--muted); }
  .strip .bar { grid-column: 2; position: relative; display: block; outline: 0 solid var(--ink); outline-offset: 3px; }
  .strip canvas { display: block; width: 100%; height: var(--h); }
  .strip .ruler { display: block; height: 6px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / var(--n, 10))); border-right: 1px solid var(--line); }
  .strip .seg { position: absolute; top: 0; height: var(--h); border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--bg); pointer-events: none; }
  .strip .tag { grid-column: 2; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-height: 1.5rem; margin-top: 6px; font-size: 0.95rem; }
  .strip .tag b { font-weight: 600; }
  .strip .chip { font: 500 0.78rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 8px; color: var(--on-state); }
  .strip .chip.good { background: var(--good-bg); } .strip .chip.bad { background: var(--bad-bg); }
  .strip .mark { position: absolute; right: 10px; top: calc(var(--h) / 2); transform: translateY(-50%); width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center;
                 color: var(--on-state); font: 700 1.5rem/1 var(--body); box-shadow: 0 0 0 3px var(--bg); pointer-events: none; }
  .strip .mark.good { background: var(--good-bg); } .strip .mark.bad { background: var(--bad-bg); }
  .strip .cap { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
  .strip:not(.done):hover .bar, .strip:not(.done):focus-visible .bar { outline-width: 2px; }
  .strip:focus-visible { outline: none; }
  .strip:not(.done):hover .key, .strip:not(.done):focus-visible .key { color: var(--ink); }
  .strip.done { cursor: default; }
  .strip.done:focus-visible .bar { outline-width: 1px; }
  .strip.answer .bar, .strip.answer:focus-visible .bar { outline: 5px solid var(--good-bg); }
  .strip.miss .bar, .strip.miss:focus-visible .bar { outline: 5px solid var(--bad-bg); }
  .strip.miss { animation: shake 0.35s ease-in-out; } .strip.answer.picked { animation: pop 0.3s ease-out; }
  @keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
  @keyframes pop { 50% { transform: scale(1.015); } }

  .after { display: grid; gap: 14px; }
  .result { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; color: var(--on-state); animation: rise 0.18s ease-out;
            padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .result.good { background: var(--good-bg); } .result.bad { background: var(--bad-bg); }
  .result-in { max-width: 848px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
  .result-in > div { min-width: 0; }
  .result strong { display: block; font: 400 clamp(2rem, 7vw, 2.75rem)/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
  .result span { display: block; margin-top: 4px; font-size: 0.98rem; }
  .result .btn { background: var(--on-state); color: #141414; }
  .result .btn:focus-visible { outline: 3px solid var(--on-state); outline-offset: 3px; }
  .wrap.has-result { padding-bottom: 190px; }
  @keyframes rise { from { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) { .result, .strip.miss, .strip.answer.picked { animation: none; } }
  .btn { justify-self: start; flex: none; padding: 12px 20px; border: 0; background: var(--ink); color: var(--bg); font: 500 0.85rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .btn:hover { opacity: 0.86; } .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .vids { background: var(--panel); padding: 14px 16px; }
  .vids h3 { margin: 0 0 8px; font: 500 0.78rem/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .vids ol { margin: 0; padding-left: 1.6rem; display: grid; gap: 4px; font-size: 0.92rem; }
  .vids li { padding-left: 2px; overflow-wrap: anywhere; }
  .vids a { color: var(--ink); text-underline-offset: 3px; text-decoration-color: var(--line); }
  .vids a:hover, .vids a:focus-visible { text-decoration-color: var(--ink); }
  .vids small { color: var(--muted); font: 400 0.78rem var(--mono); white-space: nowrap; }

  .end { display: grid; gap: 18px; }
  .final { margin: 0; font: 400 clamp(2.5rem, 9.5vw, 5.25rem)/0.98 var(--display); text-transform: uppercase; }
  .gallery { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .gallery li { display: grid; gap: 5px; }
  .gallery span { font-size: 0.9rem; font-weight: 600; }
  .gallery canvas { display: block; width: 100%; height: 44px; }
  .foot { border-top: 1px solid var(--line); padding-top: 12px; margin: 0; color: var(--muted); font-size: 0.82rem; max-width: 70ch; }
  @media (max-width: 480px) { .strip { grid-template-columns: 1.3rem minmax(0, 1fr); column-gap: 4px; } .wrap { gap: 18px; padding-block: 20px 40px; } }
</style>

  const subs = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + " million" : n >= 1e3 ? Math.round(n / 1e3) + ",000" : String(n);
  const day = d => d && d.length === 8 ? new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8))).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) : "";
  const watch = id => /^[A-Za-z0-9_-]{11}$/.test(id) ? "https://www.youtube.com/watch?v=" + id : null;

  // Each creator's stripes as an image one pixel tall; the visible canvases stretch it.
  const SRC = C.map(c => {
    const n = c.colors.length / 6, cv = document.createElement("canvas"); cv.width = n; cv.height = 1;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(n, 1);
    for (let i = 0; i < n; i++) { const v = parseInt(c.colors.substr(i * 6, 6), 16); img.data.set([v >> 16, (v >> 8) & 255, v & 255, 255], i * 4); }
    ctx.putImageData(img, 0, 0); return cv;
  });
  const paint = cv => {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const ctx = cv.getContext("2d"), src = SRC[+cv.dataset.c]; ctx.imageSmoothingEnabled = w < src.width; ctx.drawImage(src, 0, 0, w, h);
  };
  const repaint = () => document.querySelectorAll("canvas[data-c]").forEach(paint);
  const canvasFor = ci => { const cv = el("canvas"); cv.dataset.c = ci; cv.setAttribute("role", "img"); return cv; };

  // D.dist[i][j] says how different two barcodes look (0 = same palette). A round only uses three that are all at
  // least FAR apart. Creators with many such partners are asked about more often, since look-alikes make dull rounds.
  const FAR = D.far, far = (a, b) => D.dist[a][b] >= FAR;
  const partners = c => { const ok = C.map((_, i) => i).filter(i => i !== c && far(c, i)), out = []; ok.forEach((a, x) => ok.slice(x + 1).forEach(b => { if (far(a, b)) out.push([a, b]); })); return out; };
  let S;
  const fresh = () => {
    const pairs = C.map((_, c) => partners(c)), pool = C.map((_, i) => i).filter(c => pairs[c].length), order = [], seen = C.map(() => 0);
    while (order.length < MAX_ROUNDS && pool.length) {          // weighted draw without replacement
      let r = Math.random() * pool.reduce((s, c) => s + pairs[c].length, 0), k = 0;
      while (k < pool.length - 1 && (r -= pairs[pool[k]].length) > 0) k++;
      order.push(pool.splice(k, 1)[0]);
    }
    const opts = order.map(c => {                           // prefer distractors this game has shown least
      const best = pairs[c].map(p => [seen[p[0]] + seen[p[1]] + Math.random() * 0.9, p]).sort((a, b) => a[0] - b[0])[0][1];
      [c, ...best].forEach(i => seen[i]++); return shuffle([c, ...best]);
    });
    return { order, opts, i: 0, score: 0, pick: null };
  };
  let best = 0; try { best = +localStorage.getItem("creator-barcodes-best") || 0; } catch (e) {}

  const showRound = () => {
    const ci = S.order[S.i], c = C[ci], opts = S.opts[S.i], done = S.pick != null;
    $("game").hidden = false; $("end").hidden = true;
    $("round").textContent = S.i + 1; $("rounds").textContent = ROUNDS; $("score").textContent = S.score;
    $("who").textContent = c.name; $("who-sub").textContent = "@" + c.handle + (c.subscribers ? " · " + subs(c.subscribers) + " subscribers" : "");
    const host = $("strips"); host.replaceChildren();
    opts.forEach((oi, k) => {
      const o = C[oi], b = el("button", "strip"); b.type = "button";
      const bar = el("span", "bar"), cv = canvasFor(oi), ruler = el("span", "ruler"), tag = el("span", "tag");
      ruler.style.setProperty("--n", o.videos.length); bar.append(cv, ruler); b.append(el("span", "key", KEYS[k]), bar, tag);
      if (!done) { b.setAttribute("aria-label", "Barcode " + KEYS[k]); cv.setAttribute("aria-label", "Barcode " + KEYS[k]); b.addEventListener("click", () => pick(k)); }
      else {
        const mine = k === S.pick, right = oi === ci;
        b.classList.add("done", right ? "answer" : mine ? "miss" : "other"); if (mine) b.classList.add("picked"); b.setAttribute("aria-disabled", "true");
        cv.setAttribute("aria-label", "Barcode of " + o.name);
        if (right) { tag.append(el("span", "chip good", mine ? "✓ Correct" : "✓ Right answer")); bar.append(el("span", "mark good", "✓")); }
        else if (mine) { tag.append(el("span", "chip bad", "✕ Your pick")); bar.append(el("span", "mark bad", "✕")); }
        tag.append(el("b", null, o.name));
        const cap = el("span", "cap"); tag.append(cap);
        const seg = el("span", "seg"); seg.hidden = true; bar.append(seg);
        const at = v => { seg.hidden = v == null; if (v == null) { cap.textContent = ""; return; } seg.style.left = (v / o.videos.length * 100) + "%"; seg.style.width = (100 / o.videos.length) + "%"; cap.textContent = o.videos[v].title; };
        bar.addEventListener("pointermove", e => { const r = bar.getBoundingClientRect(); at(Math.min(o.videos.length - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * o.videos.length)))); });
        bar.addEventListener("pointerleave", () => at(null));
        if (oi === ci) b._at = at;
      }
      host.append(b);
    });
    $("after").hidden = !done; $("result").hidden = !done; $("wrap").classList.toggle("has-result", done);
    if (done) {
      const right = opts[S.pick] === ci, letter = KEYS[opts.indexOf(ci)];
      $("result").className = "result " + (right ? "good" : "bad");
      $("verdict-big").textContent = right ? "✓ Correct" : "✕ Wrong";
      $("verdict").textContent = right ? "Barcode " + letter + " is " + c.name + "." : c.name + " is barcode " + letter + ". You picked " + C[opts[S.pick]].name + ".";
      $("next").textContent = S.i + 1 < ROUNDS ? "Next creator" : "See final score";
      $("vids-head").textContent = "Barcode " + letter + ", left to right: the " + c.videos.length + " most recent videos from " + c.name;
      const ans = host.querySelector(".answer"), list = $("vids"); list.replaceChildren();
      c.videos.forEach((v, n) => {
        const li = el("li"), url = watch(v.id), a = el(url ? "a" : "span", null, v.title);
        if (url) { a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; }
        li.append(a, document.createTextNode(" "), el("small", null, [day(v.date), v.minutes ? v.minutes + " min" : ""].filter(Boolean).join(" · ")));
        const on = () => ans && ans._at(n), off = () => ans && ans._at(null);
        li.addEventListener("pointerenter", on); li.addEventListener("pointerleave", off); a.addEventListener("focus", on); a.addEventListener("blur", off);
        list.append(li);
      });
    }
    repaint();
  };

  const showEnd = () => {
    $("game").hidden = true; $("end").hidden = false; $("result").hidden = true; $("wrap").classList.remove("has-result"); $("score").textContent = S.score; $("round").textContent = ROUNDS;
    if (S.score > best) { best = S.score; try { localStorage.setItem("creator-barcodes-best", String(best)); } catch (e) {} }
    $("final").textContent = S.score + " of " + ROUNDS;
    $("best").textContent = S.score === ROUNDS ? "A perfect round." : "Your best so far is " + best + " of " + ROUNDS + ".";
    const g = $("gallery"); g.replaceChildren();
    C.map((c, i) => [c, i]).sort((a, b) => a[0].name.localeCompare(b[0].name)).forEach(([c, i]) => { const li = el("li"), cv = canvasFor(i); cv.setAttribute("aria-label", "Barcode of " + c.name); li.append(el("span", null, c.name), cv); g.append(li); });
    repaint();
  };
  const render = () => S.i >= ROUNDS ? showEnd() : showRound();
  const pick = k => { if (S.pick != null) return; S.pick = k; if (S.opts[S.i][k] === S.order[S.i]) S.score++; render(); $("next").focus({ preventScroll: true }); };
  $("next").addEventListener("click", () => { S.i++; S.pick = null; render(); if (S.i < ROUNDS) $("game").scrollIntoView({ block: "start" }); else window.scrollTo(0, 0); });
  $("again").addEventListener("click", () => { S = fresh(); ROUNDS = S.order.length; render(); window.scrollTo(0, 0); });
  document.addEventListener("keydown", e => { const k = ["1", "2", "3"].indexOf(e.key); if (k >= 0 && S.i < ROUNDS && S.pick == null && !e.metaKey && !e.ctrlKey && !e.altKey) pick(k); });
  window.addEventListener("resize", repaint);

  $("how").textContent = "Every stripe is the average color of one frame of video. Each barcode runs left to right through a creator's most recent videos (10 for most), 100 frames from each. One of the three below belongs to the creator named. Pick it.";
  $("foot").textContent = "Colors come from YouTube's seek-bar preview frames, collected " + D.collected + ". The page holds only colors, titles and links; no video or image is stored here.";

  const valid = s => s && Array.isArray(s.order) && s.order.length >= 1 && s.order.every(i => i >= 0 && i < C.length) && Array.isArray(s.opts) && s.opts.length === s.order.length && s.opts.every(o => Array.isArray(o) && o.length === 3 && o.every(i => i >= 0 && i < C.length));
  const start = saved => { S = valid(saved) ? saved : fresh(); ROUNDS = S.order.length; render(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint); };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => S);
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
})();
</script>
</body>
</html>
